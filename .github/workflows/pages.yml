name: Publish DC01 static showcase
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test
        run: node --test tests/*.test.cjs
      - name: Offline publisher safety checks
        run: python tests/publish-github.test.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static release
        run: node tools/build-static.cjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Audit public payload
        run: node tools/audit-public.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
